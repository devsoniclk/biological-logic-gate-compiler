[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biological-logic-gate-compiler"
version = "0.1.0"
description = "Compiler translating Boolean logic gates into synthetic biological gene regulatory circuits"
readme = "README.md"
authors = [{ name = "Lakshitha Dananjaya", email = "dananjayarox01@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
bio-compiler = "biological_logic_compiler.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=biological_logic_compiler --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["biological_logic_compiler"]
